# LR SWEEP 2/3 — java doc_causal, e16 repeat schedule, isolating whether the
# fixed muon_lr=0.003 is still right for a schedule this long. Diagnosis: e8's
# cooldown improves immediately at cooldown-start; e12/e16's cooldown doesn't
# start improving until ~4-5k steps after cooldown begins, leaving both worse
# than e8 despite far more total steps. Same epoch_dirs/max_optimizer_steps as
# the real java.dc.repeat.e16 arm (full-length, not a shortened check — the
# effect under test is tied to stable-phase LENGTH, so truncating would defeat
# the point). Pick the winner from the periodic val_loss_mean trajectory (cheap,
# already logged every 250 steps) rather than a separate probe on all three.
# Generated from configs/java_sweep/java_veoff_dc.yaml.
data:
  dataset_dir: /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java
  strategy: 'bfs'
  layout_policy: 'stochastic_slash_comment_prefix'
  inference_layout_policy: 'eos'
  order_mode: 'prefer_targets_first'
  doc_budget: null
  train_dir:   /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java/splits/train
  epoch_dirs:  [/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0,/fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0]
  val_dirs:
    val_community: /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java/splits/val_community
    val_random:    /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java/splits/val_random
  test_dirs:
    test_community: /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java/splits/test_community
    test_random:    /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java/splits/test_random

model:
  compile: true
  compile_mode: 'default'
  attention_backend: 'triton'
  inference_attention_backend: 'flex'
  mask_type: 'doc_causal'
  activation_checkpointing: false
  model_dim: 1024
  num_layers: 24
  num_heads: 8    # 8H × 128Dh = 1024
  max_seq_len: 32768
  drop_path_rate: 0.0
  fp8: false
  weight_tying: true
  untie_at_frac: 0.667
  ignore_index: -100
  dtype: 'bfloat16'
  logit_softcap: 30.0
  mtp_extra_weights: [0.5, 0.25]
  mtp_decay_steps: 0
  ve_layers: []
  shared_ve_bank: false

optimizer:
  type: 'muon'
  muon_wd: 0.1
  adamw_wd: 0.005
  momentum: 0.95
  muon_beta2: 0.95
  beta1: 0.9
  beta2: 0.95
  muon_lr: 0.003
  adamw_lr: 3e-05
  muon_momentum_warmup_steps: 300
  adamw_embed_beta1: 0.5

train_loop:
  epochs: 1
  max_optimizer_steps: 33792
  warmup_percent: 0.02
  cooldown_frac: 0.4
  min_lr_ratio: 0.1
  val_steps: 20
  val_interval: 250
  save_latest_interval: 250
  atomic_feature_kwargs:
    norm_clip_value: 1.0
    accum_steps: 1

seed: 42

eval:
  run_on_completion: false
  benchmarks:
    - {name: held_out_perplexity,       conditions: [doceval]}
    - {name: community_pack_perplexity, conditions: [doceval]}
    - {name: humaneval_buggy,           conditions: [doceval], language: java}
  max_docs: 500
  link_fuzzy_match: false
